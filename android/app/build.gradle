plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.kisel.backlog'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kisel.backlog'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('backlog.keystore')
            storePassword 'backlog-app'
            keyAlias 'backlog'
            keyPassword 'backlog-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
