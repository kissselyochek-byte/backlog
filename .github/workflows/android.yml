name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Backlog.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Бэклог для Android
          body: Скачай Backlog.apk на телефон и установи. Новая версия ставится поверх старой, прогресс сохраняется.
          files: Backlog.apk
          make_latest: true
